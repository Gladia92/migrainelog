name: Build MigraineLog

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Compute version (semver + horodatage en métadonnée)
        id: ver
        shell: pwsh
        run: |
          # Base semver lue dans package.json (ex: 1.1.0), métadonnée = horodatage
          $base    = (Get-Content package.json -Raw | ConvertFrom-Json).version -replace '\+.*$',''
          $stamp   = Get-Date -Format 'yyyy.MM.dd.HHmm'
          $version = "$base+$stamp"     # ex: 1.1.0+2026.06.08.2055  (nom de l'exe)
          $tag     = "v$base-$stamp"    # ex: v1.1.0-2026.06.08.2055 (tag git, sûr en URL)
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "TAG=$tag"         >> $env:GITHUB_OUTPUT
          Write-Host "version=$version  tag=$tag"

      - name: Appliquer la version et créer le tag
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = "${{ steps.ver.outputs.VERSION }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git tag "${{ steps.ver.outputs.TAG }}"
          git push origin "${{ steps.ver.outputs.TAG }}"
          Write-Host "Version appliquée : ${{ steps.ver.outputs.VERSION }}"

      - name: Import certificate
        if: env.CSC_LINK != ''
        run: |
          $cert_base64 = "${{ secrets.CSC_LINK }}"
          $cert_bytes = [Convert]::FromBase64String($cert_base64)
          $cert_path = "cert.pfx"
          [IO.File]::WriteAllBytes($cert_path, $cert_bytes)
          $pwd = ConvertTo-SecureString -String "${{ secrets.CSC_KEY_PASSWORD }}" -Force -AsPlainText
          Import-PfxCertificate -FilePath $cert_path -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Write-Host "Certificate imported"
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}

      - name: Build
        run: npm run make
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MigraineLog
          path: out/*.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: MigraineLog ${{ steps.ver.outputs.VERSION }}
          files: out/*.exe
