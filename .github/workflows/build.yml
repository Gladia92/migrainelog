name: Build MigraineLog

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Generate tag
        id: tag
        run: |
          $tag = "v$(Get-Date -Format 'yyyy.MM.dd.HHmm')"
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git tag $tag
          git push origin $tag
          Write-Host "Created tag $tag"
        shell: pwsh

      - name: Set version from tag
        run: |
          $tag = "${{ steps.tag.outputs.TAG }}" -replace '^v', ''
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = $tag
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
          Write-Host "Version set to $tag"
        shell: pwsh

      - name: Import certificate
        if: env.CSC_LINK != ''
        run: |
          $cert_base64 = "${{ secrets.CSC_LINK }}"
          $cert_bytes = [Convert]::FromBase64String($cert_base64)
          $cert_path = "cert.pfx"
          [IO.File]::WriteAllBytes($cert_path, $cert_bytes)
          $pwd = ConvertTo-SecureString -String "${{ secrets.CSC_KEY_PASSWORD }}" -Force -AsPlainText
          Import-PfxCertificate -FilePath $cert_path -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Write-Host "Certificate imported"
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}

      - name: Build
        run: npm run make
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MigraineLog
          path: out/*.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: MigraineLog ${{ steps.tag.outputs.TAG }}
          files: out/*.exe
